[package]
name = "caddy-wit-dns-cloudflare"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
wit-bindgen = "0.59"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
caddy-wit-caddyfile = { path = "../../../sdk/rust/caddyfile" }

[profile.release]
opt-level = "s"
lto = true
strip = true
